[project]
name = "sigzenbi"
authors = [
    { name = "SigzenBI", email = "info@sigzenbi.com" }
]
description = "Dashboards and plain-English answers from your ERPNext data"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # The box key pair (Ed25519 signatures, X25519 sealing; Central SRS Part F). Already
    # installed with Frappe; declared because this app imports it directly.
    "cryptography",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
